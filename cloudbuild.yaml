substitutions:
  _REGION: us-central1
  _AR_REPO: file-uploader
  _SERVICE_NAME: file-uploader
  _INSTANCE_CONNECTION: pet-projects-461723:us-central1:the-odin-project
  _DB_DATABASE: file_uploader

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/pet-projects-461723/secrets/TOP-SQL-USER/versions/latest
      env: 'DB_USER'
    - versionName: projects/pet-projects-461723/secrets/TOP-SQL-PW/versions/latest
      env: 'DB_PASSWORD'

steps:
  # Create database if it doesn't exist
  - name: 'postgres:alpine'
    id: 'Create database'
    entrypoint: sh
    secretEnv: ['DB_USER', 'DB_PASSWORD']
    args:
      - -c
      - |
        curl -o cloud-sql-proxy \
          https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.22.0/cloud-sql-proxy.linux.amd64
        chmod +x cloud-sql-proxy
        ./cloud-sql-proxy --port 5432 ${_INSTANCE_CONNECTION} &
        sleep 5
        PGPASSWORD=$$DB_PASSWORD psql -h localhost -U $$DB_USER -d postgres -c "CREATE DATABASE ${_DB_DATABASE}" 2>/dev/null || true

  # Migrate using Prisma
  - name: 'node:24-slim'
    id: 'Run Prisma migrations'
    entrypoint: sh
    secretEnv: ['DB_USER', 'DB_PASSWORD']
    args:
      - -c
      - |
        apt-get update && apt-get install -y curl
        curl -o cloud-sql-proxy \
          https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.22.0/cloud-sql-proxy.linux.amd64
        chmod +x cloud-sql-proxy
        ./cloud-sql-proxy --port 5432 ${_INSTANCE_CONNECTION} &
        sleep 5
        npm ci
        DATABASE_URL="postgresql://$$DB_USER:$$DB_PASSWORD@localhost:5432/${_DB_DATABASE}" \
          npx prisma migrate deploy

  # Build artifact repo if doesn't exist
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: 'Create Artifact Registry repository'
    entrypoint: bash
    args:
      - -c
      - |
        gcloud artifacts repositories describe ${_AR_REPO} \
          --location=${_REGION} || \
        gcloud artifacts repositories create ${_AR_REPO} \
          --repository-format=docker \
          --location=${_REGION} \
          --description="Docker repository for ${_SERVICE_NAME}"

  - name: gcr.io/cloud-builders/docker
    id: 'Build Docker image'
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: 'Push image to Artifact Registry'
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: 'Deploy to Cloud Run'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=INSTANCE_CONNECTION_NAME=${_INSTANCE_CONNECTION},DB_DATABASE=${_DB_DATABASE}
      - --set-secrets=DB_USER=TOP-SQL-USER:latest,DB_PASSWORD=TOP-SQL-PW:latest
      - --add-cloudsql-instances=${_INSTANCE_CONNECTION}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest
